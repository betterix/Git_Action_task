name: Build and run Node.js app

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Build Docker image
        run: |
          eval "$(minikube docker-env)"
          docker build --pull -t node-app:latest .

      - name: Deploy
        run: |
          kubectl apply -f k8s-node-app.yaml

      - name: Wait for app
        run: |
          kubectl rollout status deployment/nodejs-app --timeout=120s

      - name: Test app
        run: |
          URL=$(minikube service nodejs-app --url)
          curl --fail "$URL"
