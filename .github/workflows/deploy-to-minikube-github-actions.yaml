name: Build and run Node.js app

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Build Docker image
        run: |
          minikube image build -t node-app:latest .

      - name: Deploy
        run: |
          kubectl apply -f k8s-node-app.yaml

      - name: Wait for app
        run: |
          kubectl rollout status deployment/nodejs-app --timeout=120s

      - name: Test app
        run: |
          kubectl port-forward service/nodejs-app 3000:80 > /tmp/port-forward.log 2>&1 &
          PF_PID=$!

          sleep 3

          cat /tmp/port-forward.log

          curl --fail http://127.0.0.1:3000

          kill $PF_PID
